[settings]

# this is the number of seconds to wait between each hit to ao3 IN
# ADDITION to the required wait times when the rate limit is hit.
# the default of 15 seconds keeps long runs well clear of the rate limit,
# at the cost of taking longer. you may wish to lower it if you are only
# fetching a few pages, or raise it further if you are still being asked
# to slow down, or if you are actively browsing ao3 while this runs.
ExtraWaitTime=15

# this is the maximum number of times to retry a web request that failed.
# setting this to zero will retry indefinitely until the request succeeds.
# note that setting this to 0 can cause the script to hang if it encounters
# a non-transient error that cannot be recovered from by retrying.
MaxRetries=30

# this is the maximum number of times in a row that a single web request
# may time out before the script gives up on it early, even if MaxRetries
# has not been reached. each timeout waits the full timeout limit, so a
# request that keeps timing out can waste a lot of time, and is unlikely to
# recover. setting this to zero disables the early cutoff, in which case
# timeouts are retried up to MaxRetries like any other error.
MaxTimeouts=3

# set this to 'true' to save your password in the settings file
# so that you do not have to enter it every time you run the script.
# if you set this to 'false' after you have already saved your password
# on a previous run, the password will be removed from the settings file 
# the next time you run the script.
SavePassword=false

# this is the maximum character length of the filename that will be
# generated for each work. if the filename is longer than this, it
# will be truncated. you can set this value to 0 to disable truncation.
#
# the name itself is not configurable. every downloaded work is named:
#   {worknum} {title} - {author} {date updated}
# the work number has to come first so a file can be matched back to its
# entry in the index, and the date it was updated on has to come last so
# that later runs can tell when ao3 has a newer version than you do.
# only the title and author are shortened to fit this limit - the work
# number and the date are always kept whole.
#
# WARNING: setting this value too large (or to zero) can cause failed
# downloads on Windows due to the maximum file path length restriction
# set by the Windows operating system.
FileNameLength=50

# setting this to true will increase the amount of information that is 
# saved in the log file, which can be useful for debugging. under normal 
# circumstances, this should be set to false. note that the extra log messages
# generated by this option will not be displayed in the log visualization file
EnableDebugLogging=false

# setting this to true adds a debug panel to the download window in the web ui,
# for working on the app itself rather than for downloading anything. it offers
# two things: skipping the step a run is currently on, and showing the end-of-run
# report filled with made-up entries so its layout can be checked without having
# to find real works that fail. under normal circumstances leave this false -
# skipping a step really does skip it, and whatever that step would have done
# does not happen.
EnableDebugTools=false

# this is the folder that your downloads will be saved to. by default, this
# is a folder named 'downloads' inside the folder that you run the script
# from. you may change this to any folder on your computer. both relative
# paths (starting from the folder that you run the script from) and absolute
# paths (such as C:\Users\yourname\Documents\fanfic on Windows, or
# /home/yourname/fanfic on Mac and Linux) are accepted. you may also use ~
# to refer to your home folder, as well as environment variables such as
# %USERPROFILE% (Windows) or $HOME (Mac and Linux). if you paste in a path
# that is surrounded by quotation marks, the quotation marks will be ignored.
# note that changing this setting does not move files that you have already
# downloaded: the script will start saving new downloads to the new location,
# and will no longer detect works saved in the old location as already
# downloaded. log files and settings files are not affected by this setting.
DownloadFolder=downloads
