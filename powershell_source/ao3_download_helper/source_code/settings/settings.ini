[settings]

# this is the number of seconds to wait between each hit to ao3 IN
# ADDITION to the required wait times when the rate limit is hit.
# the default of 15 seconds keeps long runs well clear of the rate limit,
# at the cost of taking longer. you may wish to lower it if you are only
# fetching a few pages, or raise it further if you are still being asked
# to slow down, or if you are actively browsing ao3 while this runs.
ExtraWaitTime=15

# this is the maximum number of times to retry a web request that failed.
# setting this to zero will retry indefinitely until the request succeeds.
# note that setting this to 0 can cause the script to hang if it encounters
# a non-transient error that cannot be recovered from by retrying.
MaxRetries=30

# this is the maximum number of times in a row that a single web request
# may time out before the script gives up on it early, even if MaxRetries
# has not been reached. each timeout waits the full timeout limit, so a
# request that keeps timing out can waste a lot of time, and is unlikely to
# recover. setting this to zero disables the early cutoff, in which case
# timeouts are retried up to MaxRetries like any other error.
MaxTimeouts=3

# set this to 'true' to save your password in the settings file
# so that you do not have to enter it every time you run the script.
# if you set this to 'false' after you have already saved your password
# on a previous run, the password will be removed from the settings file 
# the next time you run the script.
SavePassword=false

# this is the maximum character length of the filename that will be
# generated for each work. if the filename is longer than this, it
# will be truncated. you can set this value to 0 to disable truncation.
#
# the name itself is not configurable. every downloaded work is named:
#   {worknum} {title} - {author} {date updated}
# the work number has to come first so a file can be matched back to its
# entry in the index, and the date it was updated on has to come last so
# that later runs can tell when ao3 has a newer version than you do.
# only the title and author are shortened to fit this limit - the work
# number and the date are always kept whole.
#
# WARNING: setting this value too large (or to zero) can cause failed
# downloads on Windows due to the maximum file path length restriction
# set by the Windows operating system.
FileNameLength=50

# setting this to true will increase the amount of information that is 
# saved in the log file, which can be useful for debugging. under normal 
# circumstances, this should be set to false. note that the extra log messages
# generated by this option will not be displayed in the log visualization file
EnableDebugLogging=false

# setting this to true adds a debug panel to the download window in the web ui,
# for working on the app itself rather than for downloading anything. it offers
# two things: skipping the step a run is currently on, and showing the end-of-run
# report filled with made-up entries so its layout can be checked without having
# to find real works that fail. under normal circumstances leave this false -
# skipping a step really does skip it, and whatever that step would have done
# does not happen. it also lets the app's own page offer debug mode (User
# settings, at the bottom): a DEBUG tab of tools for trying the app out, and dummy
# data in place of your library. a downloaded app never offers it otherwise.
EnableDebugTools=false

# setting this to true makes the helper print to its own window - or, for a
# hosted helper, to the host's log - every request it receives (the time, the
# method, the path and the answer it gave) and every line a run says, tagged
# with the run it came from. the same lines still appear in the web page. the
# passcode and the ao3 login are never printed. under normal circumstances leave
# this false: a long run prints a line per fic per format.
EnableConsoleLogging=false

# how many minutes a background run may sit paused before the helper abandons
# it. an abandoned run ends the way a stopped one does - everything it saved is
# kept, and it can be resumed from the History tab, or started again to carry on
# from what is still missing. while paused it no longer keeps a hosted helper
# awake, so on a host that sleeps when idle (Render's free plan sleeps after
# about 15 minutes) keep this below that, or the host may end the run first.
# set it to 0 to never abandon a paused run. runs that are not in the
# background are never abandoned: they end when their page is closed anyway.
PausedRunTimeoutMinutes=10

# how many minutes a question a run stops to ask (whether to replace a file
# with no date in its name, whether to ask FicHub, and the rest below) waits for an answer before
# the run carries on with that question's default answer. set it to 0 to take
# the default at once without waiting. a background run never waits: it takes
# the answer it was given when it started, or the default.
QuestionTimeoutMinutes=30

# the answer a run takes for itself when nobody answers in time, when it is
# stopped while asking, and on a background run that was not told.
#
# a quick scan with no earlier scan to measure back to, but an index already in
# the folder: full reads the whole listing, since goes back to when the index
# was last written.
QuickScanFloorAnswer=full

# older copies of a work beside the newest one: leave keeps them all, newest
# deletes the older ones.
DuplicateCopiesAnswer=leave

# whether to ask FicHub for the works ao3 would not give: yes or no.
FicHubAnswer=yes

# whether to take a format FicHub only has an older version of, when there is
# no copy of that format at all: yes or no.
FicHubOlderCopyAnswer=yes

# whether an overwriting run should replace a copy that is newer than the
# version it is about to write: yes or no.
OverwriteNewerCopyAnswer=no

# a file whose name has no date written the way this app writes one is never
# replaced without asking. these are the answers taken when nobody answers in
# time, by where the incoming version comes from (AO3 or FicHub) and what the
# date guessed from the file's name says: no keeps your file, yes replaces it.
#
# the guessed date is older than AO3's version (replacing is recommended).
AO3GuessedOlderAnswer=no

# the guessed date is the same as AO3's version, or newer (keeping is recommended).
AO3GuessedNewerAnswer=no

# no date can be read from the name, so it cannot be judged (keeping is recommended).
AO3UnknownDateAnswer=no

# the guessed date is older than FicHub's copy (replacing is recommended).
FicHubGuessedOlderAnswer=no

# the guessed date is the same as FicHub's copy, or newer (keeping is recommended).
FicHubGuessedNewerAnswer=no

# no date can be read from the name, so it cannot be judged against FicHub's copy
# (keeping is recommended).
FicHubUnknownDateAnswer=no

# how many seconds a single request to ao3 may take altogether before it is
# given up on and tried again (counting towards MaxTimeouts). while it waits, a
# run says it is still waiting every StillWaitingSeconds.
RequestTimeoutSeconds=60
StillWaitingSeconds=15

# when ao3 answers with its maintenance page: how many more times to ask, and
# how many seconds apart, before every request to ao3 on that run gives up.
MaintenanceRetries=2
MaintenanceRetrySeconds=30

# a failed request is asked again after a wait that doubles each time, up to
# this many seconds.
RetryMaxWaitSeconds=30

# how many minutes a run waits for the web page to read or write a file in the
# library before giving up. long, because a large file on its way to Dropbox can
# take minutes.
LibraryTimeoutMinutes=15

# how many seconds a run carries on with no web page connected, for a page
# reconnecting after a blip, before it gives up on it. background runs do not
# need the page and ignore this.
PageGoneSeconds=30


# where the web page finds this helper. leave it as it is to run everything on
# this computer. set it to the address of a hosted helper (for example
# https://my-helper.onrender.com) when the page is published somewhere else,
# such as GitHub Pages. the page reads this when it is built, so changing it
# means building the page again - the helper itself ignores it.
HelperUrl=http://127.0.0.1:4400

# setting this to true makes the helper refuse every request that does not
# carry the passcode, and makes the web page ask for it before doing anything.
# turn it on for a helper hosted on a server, where anyone who finds its
# address could otherwise use it (and the ao3 login it is given). the passcode
# itself is NOT kept in this file: it is read from the AO3DOWNLOADER_PASSCODE
# environment variable, because this file is copied into builds and images.
# the helper will not start with this on and no passcode set, and will not
# listen on anything but this computer with this off.
RequirePasscode=false

# the address of the web page allowed to use a hosted helper, exactly as the
# browser shows it, with no path and no trailing slash - for example
# https://someone.github.io. the page on this computer is always allowed.
PageOrigin=
