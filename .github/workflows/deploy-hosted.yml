name: "build & deploy hosted app and github releases"

# One person's own hosted copy: the helper on Render, the page on GitHub Pages under /app/.
# HOSTING.md is the full setup - what to create on Render, and every variable and secret
# below. It also builds the Windows, Mac and Linux apps and publishes them as one GitHub
# release. Runs on every push to main, and by hand from the Actions tab.
#
# Nothing secret is written into anything this builds. settings.ini (baked into a public
# image) and app-config.json (published on a public website) carry only the helper's
# address, the passcode flag and the public key. The passcode and the private key go
# straight from GitHub secrets to Render's environment variables.

on:
  # every change to main is released: a new version, the apps on GitHub, the helper on Render
  # and the page on Pages
  push:
    branches: [main]
    # nothing built reads these, so a change to them alone would only make a release that is
    # the same as the last - and tell everyone with the app to update to it
    paths-ignore:
      - '**.md'
      - 'wiki/**'
      - 'INSTRUCTIONS.txt'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hosted
  cancel-in-progress: false

jobs:
  tests:
    name: run the tests
    # both suites, before anything else: every job below waits on the version, and the version
    # waits on these, so a failing test ends the run with nothing tagged, released or deployed
    uses: ./.github/workflows/test.yml

  version:
    name: decide this deployment's version and tag it
    needs: tests
    # one version for everything this run builds - the page on github pages and the windows,
    # mac and linux apps. the VERSION file when it is higher than every release (a bigger step, like 2.0.0),
    # and otherwise the latest release with its last number raised
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # to push the tag
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: work out the version
        id: next
        working-directory: powershell_source/ao3_download_helper
        run: |
          git fetch --tags --force --quiet
          uv sync --frozen
          version=$(uv run --no-sync python deploy_config.py next-version \
            --tags "$(git tag -l 'v*')" --requested "$(cat "$GITHUB_WORKSPACE/VERSION")")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "this deployment is version $version"

      - name: tag the commit with it
        # tagged before anything is built, so two deployments can never build the same
        # version. a deployment that fails after this has used its number, and the next one
        # takes the one after - a gap, never a repeat
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

  settings:
    name: write settings.ini and the page's config
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: write the files
        working-directory: powershell_source/ao3_download_helper
        env:
          # every repository variable at once. each settings.ini key is set from the variable
          # of the same name in upper snake case (ExtraWaitTime from EXTRA_WAIT_TIME), and
          # passing them all means a key added to settings.ini later needs no change here.
          # variables only - secrets are never in `vars`
          DEPLOY_VARIABLES: ${{ toJSON(vars) }}
          OWNER: ${{ github.repository_owner }}
          # read only to derive the public key for the page; never written anywhere
          AO3DOWNLOADER_PRIVATE_KEY: ${{ secrets.AO3DOWNLOADER_PRIVATE_KEY }}
          # the page says which version it is, and checks the releases for a newer one
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # the pages site's own address, used when PAGE_ORIGIN is not set. a browser sends
          # it lowercase
          export DEFAULT_PAGE_ORIGIN="https://${OWNER,,}.github.io"
          uv sync --frozen
          uv run --no-sync python deploy_config.py settings --out hosted-settings.ini
          uv run --no-sync python deploy_config.py page-config --settings hosted-settings.ini --out app-config.json \
            --version "$VERSION" --repo "$GITHUB_REPOSITORY"

      - name: keep them for the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: deploy-config
          path: |
            powershell_source/ao3_download_helper/hosted-settings.ini
            powershell_source/ao3_download_helper/app-config.json
          retention-days: 1

  helper:
    name: build the helper and deploy it to render
    needs: settings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: fetch settings.ini
        uses: actions/download-artifact@v4
        with:
          name: deploy-config
          path: powershell_source/ao3_download_helper

      - name: name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ao3downloader-helper" >> "$GITHUB_ENV"

      - name: log in to the github container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: powershell_source/ao3_download_helper
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: check the render secrets are there
        # after the push, not before: render can only be pointed at an image that exists, so
        # the very first run publishes it and then stops here, saying what is still to do
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          AO3DOWNLOADER_PASSCODE: ${{ secrets.AO3DOWNLOADER_PASSCODE }}
        run: |
          missing=0
          for name in RENDER_API_KEY RENDER_SERVICE_ID RENDER_DEPLOY_HOOK AO3DOWNLOADER_PASSCODE; do
            if [ -z "${!name}" ]; then echo "::error::the $name secret is not set - see HOSTING.md"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::notice::the image is published as ${IMAGE}:latest - create the render service from it, set the secrets, and run this again"
          fi
          exit $missing

      - name: hand render the secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          AO3DOWNLOADER_PASSCODE: ${{ secrets.AO3DOWNLOADER_PASSCODE }}
          AO3DOWNLOADER_PRIVATE_KEY: ${{ secrets.AO3DOWNLOADER_PRIVATE_KEY }}
        run: |
          # one variable at a time: replacing the whole list would also delete anything
          # set by hand on render. jq does the quoting, since the key runs over many lines
          for name in AO3DOWNLOADER_PASSCODE AO3DOWNLOADER_PRIVATE_KEY; do
            jq -n --arg value "${!name}" '{value: $value}' | curl --fail-with-body -sS -o /dev/null \
              -X PUT "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${name}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data @-
            echo "set $name on render"
          done

      - name: deploy this image
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # the exact image just pushed, by its commit, rather than whatever :latest is by then
          image=$(jq -rn --arg v "${IMAGE}:${GITHUB_SHA}" '$v | @uri')
          curl --fail-with-body -sS -o /dev/null -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${image}"
          echo "render is deploying ${IMAGE}:${GITHUB_SHA}"

  pages:
    name: build the page and publish it to github pages
    # after the helper, so a new page never goes out ahead of the helper it expects
    needs: [settings, helper]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}app/

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui_source/package-lock.json

      - name: configure pages
        id: pages
        uses: actions/configure-pages@v5

      - name: build
        working-directory: gui_source
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npx ng build --base-href "${BASE_PATH}/app/" --output-path ../pages-build

      - name: fetch the page's config
        uses: actions/download-artifact@v4
        with:
          name: deploy-config
          path: deploy-config

      - name: assemble the site
        run: |
          mkdir -p site
          mv pages-build/browser site/app
          # replaces the default one, which points at a helper on this computer
          cp deploy-config/app-config.json site/app/app-config.json
          # the site's root has nothing of its own, so it sends visitors to the app
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=app/">
          <title>AO3 Library</title>
          <a href="app/">AO3 Library</a>
          HTML

      - name: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: deploy
        id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: build the windows app and publish it
    # nothing here depends on the hosted copy - only on the version - so it runs alongside
    # it, and a windows build that fails does not hold up the helper or the page. the app
    # runs its own helper on the computer it is started on - it never talks to the hosted one
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write

  mac:
    name: build the mac app and publish it
    # the same as the windows app: needs only the version, runs alongside everything else,
    # and adds its zip to the same release
    needs: version
    uses: ./.github/workflows/build-mac.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write

  linux:
    name: build the linux app and publish it
    # the same as the windows and mac apps: needs only the version, runs alongside everything
    # else, and adds its zip to the same release
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write

  feedback:
    name: deploy the feedback service to cloudflare
    # the feedback tab's Worker (feedback_worker/, FEEDBACK.md). it opens a GitHub issue for
    # each submission, so people never leave the page - and it is not the Render helper, which
    # answers its owner alone. needs only the tests: nothing it does depends on the version.
    # skipped, with a notice, until the cloudflare secrets are set - feedback is optional
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # to make the labels the Worker puts on its issues
      issues: write

    steps:
      - name: check the cloudflare secrets are there
        id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FEEDBACK_GITHUB_TOKEN TURNSTILE_SECRET_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::the feedback service is not deployed - set${missing} (FEEDBACK.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: make the labels
        # the Worker's token may only write issues, and GitHub drops a label that does not
        # exist rather than making it - so they are made here. --force leaves one that is there
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create feedback --force --color 0e8a16 --description "Sent from the app's feedback tab"
          gh label create positive --force --color 2ea44f --description "Feedback: positive"
          gh label create negative --force --color d73a4a --description "Feedback: negative"

      - name: setup node
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: deploy the worker, then hand it its secrets
        # the secrets go straight from github's to the Worker's, through stdin - never a file,
        # never the page. the Worker's address is FEEDBACK_URL, set as a repository variable
        if: steps.ready.outputs.ready == 'true'
        working-directory: feedback_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          # which repository the issues go in, and which pages may send them, are in
          # wrangler.toml - a fork changes them there
          npx --yes wrangler@4 deploy
          printf '%s' "$FEEDBACK_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN
          printf '%s' "$TURNSTILE_SECRET_KEY" | npx --yes wrangler@4 secret put TURNSTILE_SECRET
