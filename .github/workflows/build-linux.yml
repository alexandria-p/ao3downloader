name: build linux app

# The Linux app: a zip holding the ao3downloader program and "Start ao3downloader.sh", which
# starts the helper, serves the page and opens Chrome or Chromium - in place of
# Start-Application.ps1, with nothing to install first. package_app.py builds it; this runs it
# on Linux, because PyInstaller builds for the system it runs on. Built on the oldest Ubuntu
# runner, since the program needs at least the glibc it was built against: the older that is,
# the more Linux systems it starts on. x86_64 only.
#
# `deploy hosted app` calls it with the version that deployment decided on, and the zip is
# then added to that version's release, beside the Windows and Mac ones. Run by hand from the
# Actions tab it builds and tries the app; given a version it publishes that too. The zip is
# always kept as a download on the run.
#
# The app updates itself on Linux too (Update now): the same bash swap the Mac uses, starting
# the app again through its launcher. Every build tries a real update from a stand-in release,
# as the Windows and Mac ones do.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish it as, e.g. 1.8.3. Empty to build and try it only.'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
  # built and tried - never published - on a pull request that changes how it is built
  pull_request:
    paths:
      - '.github/workflows/build-linux.yml'
      - 'powershell_source/ao3_download_helper/package_app.py'
      - 'powershell_source/ao3_download_helper/source_code/desktop.py'
      - 'powershell_source/ao3_download_helper/source_code/updater.py'
      - 'powershell_source/ao3_download_helper/stand_in_release.py'
      - 'powershell_source/ao3_download_helper/source_code/settings_file.py'
      - 'powershell_source/ao3_download_helper/build_artifacts.py'
      - 'powershell_source/ao3_download_helper/pyproject.toml'
      - 'powershell_source/ao3_download_helper/uv.lock'

permissions:
  contents: read

jobs:
  build:
    name: build and try the linux app
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      # only to publish the release
      contents: write
    env:
      APP_VERSION: ${{ inputs.version || '0.0.1' }}
      ZIP: dist/ao3downloader-linux-x86_64.zip

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v4
        with:
          # the angular cli needs 22.22.3+ or 24.15+
          node-version: 24
          cache: npm
          cache-dependency-path: gui_source/package-lock.json

      - name: setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: install the page's dependencies
        working-directory: gui_source
        run: npm ci

      - name: install the helper's dependencies and pyinstaller
        working-directory: powershell_source/ao3_download_helper
        run: uv sync --frozen --group package

      - name: write the app's settings.ini from the deployment variables
        # the same variables, and the same pinned local-helper settings, as the Windows app
        working-directory: powershell_source/ao3_download_helper
        env:
          # variables only - secrets are never in `vars`, and none is used here
          DEPLOY_VARIABLES: ${{ toJSON(vars) }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          export DEFAULT_PAGE_ORIGIN="https://${owner}.github.io"
          uv run --no-sync python deploy_config.py local-settings --out linux-settings.ini

      - name: build the app
        working-directory: powershell_source/ao3_download_helper
        run: |
          uv run --no-sync python package_app.py --settings linux-settings.ini \
            --version "$APP_VERSION" --repo "$GITHUB_REPOSITORY"

      - name: unzip it as a download would be, start it, and check the page and the helper answer
        # what someone downloading it does: unzip it (unzip keeps what the zip holds -
        # permissions and links) and run the launcher. no desktop and no browser on a runner,
        # so the launcher runs the program straight rather than opening a terminal for it
        env:
          AO3DOWNLOADER_NO_BROWSER: '1'
        run: |
          place="$RUNNER_TEMP/unzipped"
          rm -rf "$place" && mkdir -p "$place"
          unzip -q "$ZIP" -d "$place"
          app="$place/ao3downloader"
          if [ ! -x "$app/ao3downloader" ]; then echo "the program is not executable"; exit 1; fi
          if [ ! -x "$app/Start ao3downloader.sh" ]; then echo "the launcher is not executable"; exit 1; fi
          file "$app/ao3downloader"
          file "$app/ao3downloader" | grep -q 'x86-64' || { echo 'not built for x86_64'; exit 1; }

          # the launcher execs the program, so this is the app's own process
          "$app/Start ao3downloader.sh" > "$RUNNER_TEMP/app.log" 2>&1 < /dev/null &
          started=$!
          stop() { kill "$started" 2>/dev/null || true; }
          trap stop EXIT
          ok=''
          for try in $(seq 1 60); do
            sleep 1
            if ! kill -0 "$started" 2>/dev/null; then echo "the app stopped by itself"; cat "$RUNNER_TEMP/app.log"; exit 1; fi
            if curl -sf -o /dev/null http://localhost:4200/ \
              && curl -sf -o /dev/null -H 'Origin: http://localhost:4200' http://127.0.0.1:4400/api/config; then
              ok=yes; break
            fi
          done
          if [ -z "$ok" ]; then echo "the page or the helper never answered"; cat "$RUNNER_TEMP/app.log"; exit 1; fi

          if [ ! -f "$app/config/settings.ini" ]; then echo "no settings.ini beside the program"; exit 1; fi
          # the page must be pointed at the app's own helper, never the hosted one
          config=$(curl -s http://localhost:4200/app-config.json)
          echo "$config"
          helper=$(echo "$config" | python3 -c 'import json,sys; print(json.load(sys.stdin)["helperUrl"])')
          version=$(echo "$config" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [ "$helper" != 'http://127.0.0.1:4400' ]; then echo "the page points at $helper"; exit 1; fi
          if [ "$version" != "$APP_VERSION" ]; then echo "the page says version '$version', not '$APP_VERSION'"; exit 1; fi
          # the packaged app updates itself - the step below tries it
          updatable=$(curl -s -H 'Origin: http://localhost:4200' http://127.0.0.1:4400/api/config \
            | python3 -c 'import json,sys; print(bool((json.load(sys.stdin).get("app") or {}).get("updatable")))')
          if [ "$updatable" != 'True' ]; then echo "the app does not say it can update itself"; exit 1; fi
          echo 'the page and the helper both answered, and settings.ini is beside the program'

      - name: install the app, change its settings, and update it from a stand-in release
        # as the Windows and Mac builds do: the same zip served as 99.0.0, with someone's edits
        # to settings.ini made first. the swap starts the app again through its launcher, in a
        # session of its own, which is part of what this tries
        env:
          AO3DOWNLOADER_UPDATE_SOURCE: http://127.0.0.1:8765
        run: |
          place="$RUNNER_TEMP/installed"
          rm -rf "$place" && mkdir -p "$place"
          unzip -q "$ZIP" -d "$place"
          app="$place/ao3downloader"
          settings="$app/config/settings.ini"
          origin='Origin: http://localhost:4200'
          helper() { curl -sf --max-time 2 -H "$origin" http://127.0.0.1:4400/api/config; }
          wait_for_helper() {
            for _ in $(seq 1 "$1"); do sleep 1; if helper > /dev/null; then return 0; fi; done
            echo "the helper did not answer within $1 seconds"; return 1
          }
          field() { python3 -c "import json,sys; d=json.load(sys.stdin)['app']; print($1)"; }

          (cd powershell_source/ao3_download_helper \
            && uv run --no-sync python stand_in_release.py "$GITHUB_WORKSPACE/$ZIP" 8765 > "$RUNNER_TEMP/release.log" 2>&1 &)
          AO3DOWNLOADER_NO_BROWSER=1 "$app/Start ao3downloader.sh" > "$RUNNER_TEMP/installed.log" 2>&1 < /dev/null &
          started=$!
          finish() {
            status=$?
            if [ "$status" != 0 ]; then
              echo '--- what the app folder holds ---'; ls -la "$app" "$app/update" 2>/dev/null
              for f in update/update.log update/swap-output.txt; do echo "--- $f ---"; cat "$app/$f" 2>/dev/null || echo '(none)'; done
              echo '--- the stand-in release ---'; cat "$RUNNER_TEMP/release.log"
              echo '--- processes ---'; pgrep -lf ao3downloader || true
            fi
            pkill -x ao3downloader || true
            pkill -f stand_in_release.py || true
          }
          trap finish EXIT

          wait_for_helper 60
          if [ "$(helper | field 'd["version"]')" != "$APP_VERSION" ]; then echo "the app is not $APP_VERSION"; exit 1; fi

          # what someone might have done since installing it
          sed -i 's/^ExtraWaitTime=.*/ExtraWaitTime=42/' "$settings"
          printf '\n# my own note\nRetiredSetting=3\n' >> "$settings"
          echo old > "$app/_internal/from-the-old-version.txt"

          code=$(curl -s -o "$RUNNER_TEMP/update.json" -w '%{http_code}' -X POST -H "$origin" \
            -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:4400/api/update)
          if [ "$code" != 202 ]; then echo "the update was not started: $code $(cat "$RUNNER_TEMP/update.json")"; exit 1; fi
          echo "update started: $(cat "$RUNNER_TEMP/update.json")"

          for _ in $(seq 1 120); do kill -0 "$started" 2>/dev/null || break; sleep 1; done
          if kill -0 "$started" 2>/dev/null; then echo 'the app never closed for the swap'; exit 1; fi
          echo 'the app closed for the swap'
          wait_for_helper 120
          echo "the app is back: $(helper)"

          log=$(cat "$app/update/update.log")
          echo "$log"
          case "$log" in *swapped*) ;; *) echo 'the swap script did not say it swapped the files'; exit 1 ;; esac
          if [ "$(helper | field 'd["update"]["state"]')" = failed ]; then echo 'the app says the update failed'; exit 1; fi
          if [ -e "$app/_internal/from-the-old-version.txt" ]; then echo 'the old _internal is still there'; exit 1; fi
          for left in update/new update/previous update/download.zip update/restarted; do
            if [ -e "$app/$left" ]; then echo "the swap left $left behind"; exit 1; fi
          done
          if [ ! -x "$app/ao3downloader" ]; then echo 'the new program is not executable'; exit 1; fi

          after=$(cat "$settings")
          echo "$after"
          grep -q '^ExtraWaitTime=42$' "$settings" || { echo "settings.ini lost ExtraWaitTime=42"; exit 1; }
          grep -q '^# my own note$' "$settings" || { echo 'settings.ini lost the note'; exit 1; }
          grep -q '# DEPRECATED: RetiredSetting' "$settings" || { echo 'RetiredSetting was not marked deprecated'; exit 1; }
          if grep -q '^RetiredSetting=' "$settings"; then echo 'RetiredSetting is still set'; exit 1; fi
          grep -q '^# RetiredSetting=3$' "$settings" || { echo 'RetiredSetting was not kept, commented out'; exit 1; }
          echo 'updated: new files in place, the app started again, settings.ini kept and brought up to date'

      - name: keep the zip on this run
        uses: actions/upload-artifact@v4
        with:
          name: ao3downloader-linux-x86_64
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: add it to this version's release
        # never from a pull request, which has no version
        if: github.event_name != 'pull_request' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        # the Windows and Mac builds publish to the same release, at the same
        # time: whichever gets there first makes it, and the others' creates fail harmlessly.
        # keep the notes the same in both workflows, since any of them may write them
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "ao3downloader $VERSION" \
              --notes "Windows: download ao3downloader-windows.zip, unzip it, and double-click ao3downloader.exe. Windows may warn that the app is not signed: choose More info, then Run anyway.

          Mac: download ao3downloader-macos-apple-silicon.zip for an M1 or later, or ao3downloader-macos-intel.zip for an Intel Mac, open it, and double-click Start ao3downloader.command. The first time, macOS says it cannot check the app: click Done, then System Settings > Privacy & Security > Open Anyway. Use Chrome, Edge, Brave or Arc - Safari and Firefox cannot open a folder for the app.

          Linux (64-bit Intel or AMD): download ao3downloader-linux-x86_64.zip, unzip it, and run Start ao3downloader.sh. Use Chrome or Chromium - Firefox cannot open a folder for the app.

          The README inside each zip says the rest." \
              || echo 'the release was made meanwhile, by another build'
          fi
          gh release upload "$TAG" "$ZIP" --clobber
          echo "published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
